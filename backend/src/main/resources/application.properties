# TalentBridge Application Properties

spring.application.name=talentbridge-backend
server.port=8080

# Database Configuration (MySQL)
# Default connects to MySQL local instance, but can be overridden via environment variables
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/talentbridge_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Ritaban@2104}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Best Practice: Disable Open-Session-In-View to enforce clean transactional boundaries in service layer
spring.jpa.open-in-view=false

# JWT Security Settings
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# 24 Hours in Milliseconds: 24 * 60 * 60 * 1000 = 86400000
jwt.expiration=${JWT_EXPIRATION:86400000}

# Swagger / OpenAPI Documentation
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Logging Configuration
logging.level.com.talentbridge=INFO
logging.level.org.springframework.security=WARN
